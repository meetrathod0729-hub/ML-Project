services:

  mongodb:
    image: mongo:7
    container_name: api-sentinel-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db


  ml-service:
    build:
      context: ./ML
      dockerfile: Dockerfile

    container_name: api-sentinel-ml
    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: api-sentinel-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/api_sentinel
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: api_sentinel_change_this_secret

    depends_on:
      - mongodb
      - ml-service


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: api-sentinel-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  mongodb_data: